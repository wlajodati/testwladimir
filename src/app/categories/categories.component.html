<div class="row main-row">
    <div class="col-12 text-center">
        <h2>Select a category and get a Chuck Norris' fact</h2>
        <div class="row my-4">
            <div class="col-6">
                <select [(ngModel)]="catSearch.category" class="custom-select">
                    <option value="">Choose one</option>
                    <option *ngFor="let category of categories" value="{{category}}">{{category | titlecase}}</option>
                </select>
                <button (click)="getNewCategoryFact()" class="btn btn-primary search-button">Search</button>
            </div>

            <div *ngIf="facts" class="col-6">
                <div class="card">
                    <div class="card-header">
                        <h3>{{facts.id}}</h3>
                    </div>
                    <img src="{{facts.icon_url}}" class="card-img-top fact-icon mx-auto d-block icon-margin" alt="">
                    <div class="card-body">
                        <div *ngIf="facts.error == true; else noError">
                            <p class="card-text fact-format-error">{{facts.value}}</p>
                        </div>
                        <ng-template #noError>
                            <p #noError class="card-text fact-format">{{facts.value}}</p>
                            <button type="button" class="btn btn-primary ml-4" (click)="addFavorite(facts.id, facts.value)">Save as favorite</button>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
